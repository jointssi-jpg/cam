workflows:
  joocam-debug:
    name: JooCam debug APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Create Gradle wrapper
        script: gradle wrapper --gradle-version 8.9
      - name: Build debug APK
        script: ./gradlew assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
